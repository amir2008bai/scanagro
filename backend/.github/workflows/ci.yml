name: backend-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fable_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fable_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-test-only@localhost:5432/fable_test
      DATABASE_URL: postgresql+asyncpg://postgres:ci-test-only@localhost:5432/fable_test
      APP_ENV: test
      VISION_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app scripts tests migrations eval
      - run: python -m ruff format --check app scripts tests migrations eval
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m pytest -q
      - run: python -m pip_audit -r requirements.txt --no-deps --disable-pip
      - run: docker build -t fable-backend:test .
      # The shipped reference photos are CC BY / CC BY-SA: redistributing them without
      # the attribution file would breach their licence, so the build fails without it.
      - name: Reference photos carry their attribution
        run: |
          python -c "
          import pathlib
          seed = pathlib.Path('reference_seed')
          web = list(seed.glob('*/web/*'))
          if web:
              sources = seed / 'SOURCES.md'
              assert sources.is_file(), 'web reference photos ship without SOURCES.md'
              text = sources.read_text(encoding='utf-8')
              missing = [p.name for p in web if p.name not in text]
              assert not missing, f'no attribution recorded for: {missing[:5]}'
          print(f'{len(web)} web references, all attributed')
          "
      # Recognition weights are not downloaded in CI: the job stays offline and fast.
      # This only proves the pipeline's own modules import and the registry is coherent.
      - name: Recognition modules import without weights
        run: |
          python -c "
          from app.services.vision.local import geometry, plate_format, attributes
          from app.services.vision.local import reference_gallery
          from app.services.vision.local.model_registry import DOWNLOADABLE
          from app.services.vision.local.pipeline import LocalRecognitionPipeline
          assert all(s.url.startswith('https://') for s in DOWNLOADABLE)
          assert all(s.license for s in DOWNLOADABLE)
          print('recognition modules OK')
          "
